name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # para publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; no se corta uno que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test # si un test falla, no se publica
      - run: npm run build
        env:
          # Opcionales (Settings → Secrets and variables → Actions → Variables). Si no existen, config.js usa
          # los valores del mock. Son Variables y no Secrets a propósito: todo VITE_* queda en el JS público.
          VITE_TRANSPORT: ${{ vars.VITE_TRANSPORT }}
          VITE_DEVICE_ID: ${{ vars.VITE_DEVICE_ID }}
          VITE_MOCK_EMAIL: ${{ vars.VITE_MOCK_EMAIL }}
          VITE_MOCK_PASSWORD: ${{ vars.VITE_MOCK_PASSWORD }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
