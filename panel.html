<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Home — Panel de control</title>
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/panel.css">
</head>
<body>
<div class="panel">
  <div class="panel__inner">
    <header class="topbar">
      <div class="brand">
        <div class="brand__logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M12 12.5l2.5 1v1.8c0 1.4-1 2.5-2.5 3.2-1.5-.7-2.5-1.8-2.5-3.2v-1.8z"/></svg>
        </div>
        <div>
          <div class="brand__name">Smart Home</div>
          <div class="brand__tagline">Sistema inteligente de automatización y seguridad</div>
        </div>
      </div>
      <div class="topbar__right">
        <span id="user" class="user"></span>
        <button id="logout" type="button" class="btn btn--ghost">Cerrar sesión</button>
      </div>
    </header>

    <main id="panel-root">
      <!-- Paso 3: estado, franja de estados, sensores, respuesta del dispositivo e historial. -->
    </main>
  </div>
</div>
<script type="module" src="./src/panel/panel.js"></script>
</body>
</html>
